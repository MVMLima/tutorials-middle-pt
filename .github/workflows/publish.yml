name: Render e publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27

      # O site é renderizado a partir do cache em `_freeze/` (commitado no repositório),
      # por isso o build não precisa do R nem dos pacotes do Epiverse no CI.
      # O perfil `ci` (_quarto-ci.yml) liga `freeze: true`. ATENÇÃO ao que isso implica,
      # verificado na prática: `freeze: true` reaproveita o resultado congelado e NÃO
      # regenera o HTML de um arquivo cujo .qmd mudou. Ou seja, editar só o TEXTO de uma
      # lição e dar push sem renderizar localmente publica a versão ANTIGA, com build verde.
      # O passo abaixo transforma essa falha silenciosa em erro explícito.
      - name: Conferir se o site publicado ficaria desatualizado
        run: python3 scripts/freshness.py --check

      - name: Renderizar o site
        run: quarto render --profile ci

      - name: Publicar no GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
